<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Market | Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cart">
  <header class="topbar">
    <div class="brand">

      <div>
        <strong>Brick Market</strong>
        <span>Buy · Trade · Sell LEGO sets</span>
      </div>
    </div>
    <nav class="nav-links">
      <a href="home.html">Home</a>
      <a href="shopping.html">Shopping</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="page-content">
    <section class="section-header">
      <div>
        <p class="eyebrow">Cart</p>
        <h1>Your checkout cart</h1>
        <p>Review your purchases, trade requests, and sell listings before completing your order.</p>
      </div>
    </section>

    <section class="cart-page">
      <div class="cart-summary-panel">
        <div class="cart-box">
          <h2>Cart summary</h2>
          <p id="cartCount">0 items</p>
          <div class="cart-items" id="cartItems"></div>
          <div class="cart-total">
            <span>Order total</span>
            <strong id="cartTotal">$0.00</strong>
          </div>
          <button class="button primary" id="checkoutButton" onclick="checkoutCart()" disabled>Checkout</button>
        </div>
      </div>
    </section>
  </main>
